# valores especificos del ambiente production para artists-service
image:
  repository: ghcr.io/aidaorantes9/sa-practica-artists-service
  tag: "v0.1.6"
  pullPolicy: Always


replicaCount: 2
autoscaling:
  enabled: false

# P9 - resiliencia ante perdida de nodo
podDisruptionBudget:
  enabled: true
  minAvailable: 1
# preferida y no requerida: con 2 workers, una regla requerida impediria
# programar el pod canary y dejaria en Pending la replica desalojada al drenar
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: artists-service
