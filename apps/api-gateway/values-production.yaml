# valores especificos del ambiente production para api-gateway
image:
  repository: ghcr.io/aidaorantes9/sa-practica-api-gateway
  tag: "v0.1.6"
  pullPolicy: Always


replicaCount: 1
autoscaling:
  enabled: false

# kind no tiene controlador de ingress: el trafico se prueba dentro del cluster contra el Service
ingress:
  enabled: false
