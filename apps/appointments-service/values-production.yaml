# valores especificos del ambiente production para appointments-service
image:
  repository: ghcr.io/aidaorantes9/sa-practica-appointments-service
  tag: "v0.1.7"
  pullPolicy: Always


replicaCount: 2
autoscaling:
  enabled: false

# P9 - resiliencia ante perdida de nodo
podDisruptionBudget:
  enabled: true
  minAvailable: 1
# preferida y no requerida: con 2 workers, una regla requerida impediria
# programar el pod canary y dejaria en Pending la replica desalojada al drenar
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: appointments-service

# P10 - observabilidad: trazas al OTel Collector y metricas leidas por Prometheus
extraEnv:
  - name: OTEL_SERVICE_NAME
    value: appointments-service
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: http://otel-collector.monitoring.svc:4318
serviceMonitor:
  enabled: true
