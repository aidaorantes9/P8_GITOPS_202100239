# valores especificos del ambiente production para auth-service
image:
  repository: ghcr.io/aidaorantes9/sa-practica-auth-service
  tag: "v0.1.8"
  pullPolicy: Always


replicaCount: 2
autoscaling:
  enabled: false

# P9 - resiliencia ante perdida de nodo
podDisruptionBudget:
  enabled: true
  minAvailable: 1
# preferida y no requerida: con 2 workers, una regla requerida impediria
# programar el pod canary y dejaria en Pending la replica desalojada al drenar
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: auth-service

# P10 - observabilidad: trazas al OTel Collector y metricas leidas por Prometheus
extraEnv:
  - name: OTEL_SERVICE_NAME
    value: auth-service
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: http://otel-collector.monitoring.svc:4318
serviceMonitor:
  enabled: true

# P10: umbral de latencia propio para el canary de auth. El login calcula bcrypt a proposito
# (p95 de /api/auth/login = 0,95 s en la version estable), asi que el limite comun de 0,5 s
# daba falsos positivos: el canary de v0.1.8 se aborto el 14/10/2026 sin cambios en el codigo.
analisis:
  maxLatenciaP95: 1
