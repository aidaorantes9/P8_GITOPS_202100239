apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-gateway-production
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/aidaorantes9/Practicas-SA-B-202100239.git
      targetRevision: main
      path: P5/charts/sa-platform/charts/api-gateway
      helm:
        parameters:
          - name: sharedConfigMapName
            value: "sa-p8-app-config"
          - name: sharedSecretName
            value: "sa-p8-app-secrets"
        valueFiles:
          - $values/apps/api-gateway/values-production.yaml
    - repoURL: https://github.com/aidaorantes9/P8_GITOPS_202100239.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
