apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aidaorantes9/P8_GITOPS_202100239.git
    targetRevision: main
    path: secrets
    directory:
      include: "app-secrets-staging.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
