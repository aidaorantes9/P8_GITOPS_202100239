apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.6.0
    helm:
      valuesObject:
        # sin las ~150 alertas genericas: solo existen las alertas por presupuesto de error (P10)
        defaultRules:
          create: false
        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeProxy:
          enabled: false
        nodeExporter:
          enabled: false
        prometheus:
          prometheusSpec:
            scrapeInterval: 15s
            evaluationInterval: 15s
            retention: 8d
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources:
              requests: {cpu: 100m, memory: 400Mi}
              limits: {memory: 1200Mi}
        alertmanager:
          alertmanagerSpec:
            resources:
              requests: {cpu: 10m, memory: 32Mi}
              limits: {memory: 128Mi}
        grafana:
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 768Mi}
          sidecar:
            dashboards:
              enabled: true
              searchNamespace: ALL
          additionalDataSources:
            - name: Loki
              uid: loki
              type: loki
              url: http://loki.monitoring.svc:3100
              jsonData:
                derivedFields:
                  - name: trace_id
                    matcherRegex: '"trace_id":"(\w+)"'
                    datasourceUid: tempo
                    url: '$${__value.raw}'
            - name: Tempo
              uid: tempo
              type: tempo
              url: http://tempo.monitoring.svc:3200
              jsonData:
                tracesToLogsV2:
                  datasourceUid: loki
                  spanStartTimeShift: '-5m'
                  spanEndTimeShift: '5m'
                  customQuery: true
                  query: '{namespace="production"} | json | trace_id="$${__trace.traceId}"'
                serviceMap:
                  datasourceUid: prometheus
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSide=true
      - Replace=true
